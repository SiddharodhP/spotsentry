[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotsentry"
version = "0.1.0"
description = "Lets long-running jobs use spot instances without losing progress."
requires-python = ">=3.11"
dependencies = ["boto3", "requests", "pyyaml", "pydantic", "numpy"]

[project.scripts]
spotsentry = "spotsentry.cli:main"

[tool.setuptools.packages.find]
include = ["spotsentry*", "workloads*"]

[tool.setuptools.package-data]
spotsentry = ["planner/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs Docker (MinIO and the AWS metadata mock)",
  "lifecycle: full worker lifecycle using local processes, no Docker needed",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
