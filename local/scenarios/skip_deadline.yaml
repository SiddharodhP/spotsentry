# Nothing fits: SpotSentry skips deliberately and keeps the previous valid checkpoint.
name: skip_deadline
job: jobs/synthetic_demo.yaml
replacement_delay_sec: 3
workload_params: { state_mb: 200, total_steps: 800, epochs: 2 }
overrides:
  checkpoint: { min_interval_sec: 600, max_interval_sec: 600, strategy: reactive }
  deadline: { override_seconds: 2 }
  store: { bandwidth_limit_mbps: 100 }
interruptions:
  - { after_sec: 12, notice_lead_sec: 30 }
expect: { exit_codes: [76, 0], emergency_tier: skip }
